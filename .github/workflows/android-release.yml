name: Build ZenithFox Browser Signed Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Pre-installed Android SDK & Accept Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools"

      - name: Set up Gradle 9.3.1 with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Validate Signing Secrets & Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Compile Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log

      - name: Cleanup Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZenithFoxBrowser-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: ignore
